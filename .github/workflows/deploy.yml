
name: Deploy Courtside Web

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: courtside-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack Courtside Web
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t candidates < <(
            find . -maxdepth 3 -type f \
              -iname '*courtside*web*.zip' | sort
          )

          if [ ${#candidates[@]} -eq 0 ]; then
            echo "Upload Courtside-Web-Deploy.zip first"
            exit 1
          fi

          archive="${candidates[$((${#candidates[@]} - 1))]}"

          echo "Using: $archive"
          mkdir -p _site
          unzip -oq "$archive" -d _site
          test -f _site/index.html
          cp -f _site/index.html _site/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
